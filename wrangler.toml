name = "student-session-tracker"
compatibility_date = "2026-11-07"
main = "src/index.js"

# Serve on https://student-session-tracker.<subdomain>.workers.dev
workers_dev = true
# Don't publish an extra public URL for every uploaded version
preview_urls = false

[assets]
directory = "./public"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "student_sessions_db"
database_id = "a06c70c4-02e6-4da2-a5a1-7127260b3f88"
